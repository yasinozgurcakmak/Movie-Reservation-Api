# Compose file for deploying on Coolify. Differs from docker-compose.yml:
# no host port bindings or fixed container names (Traefik routes to the container),
# and secrets are generated by Coolify via SERVICE_* magic variables.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-MovieReservationDb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-MovieReservationDb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  webapi:
    build:
      context: .
      dockerfile: dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - PathBase=${PATH_BASE:-/movie-reservation-api}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-MovieReservationDb};Username=${POSTGRES_USER:-postgres};Password=${SERVICE_PASSWORD_POSTGRES}
      - ConnectionStrings__Redis=redis:6379,abortConnect=false,connectTimeout=1000
      - Jwt__SecretKey=${SERVICE_BASE64_64_JWT}
      - Admin__Password=${SERVICE_PASSWORD_ADMIN}
      - Email__Username=${SMTP_USERNAME:-}
      - Email__Password=${SMTP_PASSWORD:-}
      - Email__FromAddress=${SMTP_USERNAME:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
