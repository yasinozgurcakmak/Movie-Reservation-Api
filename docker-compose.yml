services:
  db:
    image: postgres:15-alpine
    container_name: movie_reservation_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  webapi:
    build:
      context: .
      dockerfile: dockerfile
    container_name: movie_reservation_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Şifre ';' gibi ayraç karakterleri içerdiği için tek tırnak içinde verilir
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password='${POSTGRES_PASSWORD}'
      - Email__Username=${SMTP_USERNAME}
      - Email__Password=${SMTP_PASSWORD}
      - Email__FromAddress=${SMTP_USERNAME}
    depends_on:
      # API açılışta migration uyguladığı için Postgres bağlantı kabul edene kadar bekle
      db:
        condition: service_healthy
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
